name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract ZIP Files If Present
        run: |
          python3 -c "
          import zipfile, os
          for root, dirs, files in os.walk('.'):
              for f in files:
                  if f.lower().endswith('.zip'):
                      p = os.path.join(root, f)
                      print('Extracting:', p)
                      with zipfile.ZipFile(p, 'r') as z:
                          z.extractall('.')
          " || true

      - name: Build Android App via Capacitor
        run: |
          # 1. Setup workspace and www directory
          mkdir -p app_builder/www
          cd app_builder

          # 2. Locate index.html or create it from repo
          HTML_SRC=$(find .. -name "index.html" | head -n 1)
          if [ -n "$HTML_SRC" ]; then
            echo "Using found index.html from $HTML_SRC"
            cp "$HTML_SRC" www/index.html
          else
            echo "Copying all web assets..."
            find .. -maxdepth 3 -name "*.html" -exec cp {} www/ \; || true
            find .. -maxdepth 3 -name "*.js" -exec cp {} www/ \; || true
            find .. -maxdepth 3 -name "*.css" -exec cp {} www/ \; || true
          fi

          # If www/index.html is still missing, pull latest entry file
          if [ ! -f "www/index.html" ]; then
            curl -sL "https://raw.githubusercontent.com/${{ github.repository }}/main/index.html" -o www/index.html || true
          fi

          # 3. Initialize Capacitor Native Project
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "SoundSync" "com.soundsync.app" --web-dir "www"
          npx cap add android

          # 4. Add Android Permissions into AndroidManifest.xml
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          PERMS='
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
          '
          sed -i "/<manifest/a $PERMS" "$MANIFEST" || true

          # 5. Sync and Compile APK
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/build/outputs/apk/debug/*.apk'
