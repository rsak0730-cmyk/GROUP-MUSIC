name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Project ZIP
        run: |
          python3 -c "
          import zipfile, os
          for root, dirs, files in os.walk('.'):
              for f in files:
                  if f.lower().endswith('.zip'):
                      p = os.path.join(root, f)
                      print('Extracting:', p)
                      with zipfile.ZipFile(p, 'r') as z:
                          z.extractall('.')
          "

      - name: Prepare Android Project
        run: |
          BUILD_FILE=$(find . -name "settings.gradle*" -o -name "build.gradle*" | head -n 1)
          if [ -n "$BUILD_FILE" ]; then
            PROJECT_DIR=$(dirname "$BUILD_FILE")
          else
            PROJECT_DIR="."
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          
          cd "$PROJECT_DIR"
          echo "GEMINI_API_KEY=dummy_key" > .env
          find . -name "build.gradle.kts" -exec sed -i '/debugConfig/d' {} + || true
          
          if [ ! -f "gradlew" ]; then
            echo "Generating missing Gradle wrapper..."
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/build/outputs/apk/debug/*.apk'
