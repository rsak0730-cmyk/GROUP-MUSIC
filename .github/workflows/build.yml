name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract All ZIP Files
        run: |
          python3 -c "
          import zipfile, glob, os
          for z in glob.glob('**/*.zip', recursive=True):
              print('Extracting:', z)
              with zipfile.ZipFile(z, 'r') as zip_ref:
                  zip_ref.extractall('.')
          "

      - name: Build Android APK
        run: |
          # 1. Look for any build.gradle or app directory
          GRADLE_FILE=$(find . -name "build.gradle*" | head -n 1)

          if [ -n "$GRADLE_FILE" ]; then
            echo "Found Android Project build file at: $GRADLE_FILE"
            PROJECT_ROOT=$(dirname "$GRADLE_FILE")
            if [ "$(basename "$PROJECT_ROOT")" = "app" ]; then
              PROJECT_ROOT=$(dirname "$PROJECT_ROOT")
            fi
            cd "$PROJECT_ROOT"

            # Auto-generate settings.gradle.kts if missing
            if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
              echo 'rootProject.name = "SyncStream"' > settings.gradle.kts
              echo 'include(":app")' >> settings.gradle.kts
            fi

            # Setup environment variables
            echo "GEMINI_API_KEY=dummy_key_12345" > .env

            # Clean debugConfig signing issues
            find . -name "build.gradle.kts" -exec sed -i '/signingConfig.*debugConfig/d' {} + || true
            find . -name "build.gradle" -exec sed -i '/signingConfig.*debugConfig/d' {} + || true

            # Generate wrapper if missing
            if [ ! -f "gradlew" ]; then
              echo "Generating Gradle wrapper..."
              gradle wrapper --gradle-version 8.7
            fi
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace

          else
            echo "Wrapping Web files into Native APK..."
            mkdir -p web_wrapper/www
            find . -maxdepth 3 -name "*.html" -exec cp {} web_wrapper/www/ \;
            find . -maxdepth 3 -name "*.js" -exec cp {} web_wrapper/www/ \; || true
            find . -maxdepth 3 -name "*.css" -exec cp {} web_wrapper/www/ \; || true

            cd web_wrapper
            npm init -y
            npm install @capacitor/core @capacitor/cli @capacitor/android
            npx cap init "SyncStream" "com.soundsync.app" --web-dir "www"
            npx cap add android
            npx cap copy
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/build/outputs/apk/debug/*.apk'
