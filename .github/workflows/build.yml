name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Project ZIP
        run: |
          python3 -c "
          import zipfile, glob, os
          for z in glob.glob('**/*.zip', recursive=True):
              print('Extracting:', z)
              with zipfile.ZipFile(z, 'r') as zip_ref:
                  zip_ref.extractall('.')
          "

      - name: Build Android Debug APK
        run: |
          # 1. Locate the exact Android root directory containing settings.gradle
          SETTINGS_FILE=$(find . -name "settings.gradle*" | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "Error: settings.gradle not found!"
            exit 1
          fi

          ROOT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Android Project Root: $ROOT_DIR"
          cd "$ROOT_DIR"

          # 2. Create required .env file for AI Studio
          echo "GEMINI_API_KEY=dummy_key_12345" > .env

          # 3. Remove the debugConfig signing line required by AI Studio
          find . -name "build.gradle.kts" -exec sed -i '/signingConfig.*debugConfig/d' {} + || true
          find . -name "build.gradle" -exec sed -i '/signingConfig.*debugConfig/d' {} + || true

          # 4. Make gradlew executable or create wrapper
          if [ -f "gradlew" ]; then
            chmod +x ./gradlew
          else
            echo "Generating Gradle wrapper..."
            gradle wrapper --gradle-version 8.7
            chmod +x ./gradlew
          fi

          # 5. Build the Debug APK
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/build/outputs/apk/debug/*.apk'
