name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Android APK
        run: |
          mkdir -p app_build/www

          # Unzip any zip archives
          python3 -c "import zipfile, glob; [zipfile.ZipFile(z).extractall('.') for z in glob.glob('**/*.zip', recursive=True)]" || true

          # Find index.html
          HTML=$(find . -name "index.html" | head -n 1)
          if [ -n "$HTML" ]; then
            cp "$HTML" app_build/www/index.html
          else
            echo "<!DOCTYPE html><html><body><h1>SoundSync App</h1></body></html>" > app_build/www/index.html
          fi

          cd app_build
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "SoundSync" "com.soundsync.app" --web-dir "www"
          npx cap add android

          # Inject permissions into AndroidManifest.xml
          python3 -c "
          p = 'android/app/src/main/AndroidManifest.xml'
          with open(p, 'r') as f: c = f.read()
          c = c.replace('<application', '<uses-permission android:name=\"android.permission.CAMERA\"/><uses-permission android:name=\"android.permission.RECORD_AUDIO\"/><uses-permission android:name=\"android.permission.MODIFY_AUDIO_SETTINGS\"/><application')
          with open(p, 'w') as f: f.write(c)
          "

          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: 'app_build/android/app/build/outputs/apk/debug/*.apk'

