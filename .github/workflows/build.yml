name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract Project ZIP
        run: |
          python3 -c "import zipfile, glob; [zipfile.ZipFile(z).extractall('.') for z in glob.glob('**/*.zip', recursive=True)]"

      - name: Prepare Environment and Fix Gradle
        run: |
          echo "GEMINI_API_KEY=dummy_key" > .env
          find . -name "build.gradle.kts" -exec sed -i '/debugConfig/d' {} + || true
          find . -name "gradlew" -exec chmod +x {} +

      - name: Build Debug APK
        run: |
          GRADLEW_FILE=$(find . -name "gradlew" | head -n 1)
          DIR=$(dirname "$GRADLEW_FILE")
          cd "$DIR"
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/build/outputs/apk/debug/*.apk'
